[workspace]
members = [
  "crates/projectyard-core",
  "crates/projectyard-index",
  "crates/projectyard-cli",
  "crates/projectyard-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/your-account/projectyard"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
